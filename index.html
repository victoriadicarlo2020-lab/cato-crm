<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d0d0d">
<title>CRM · Cato Mídias</title>
<link rel="icon" href="assets/cato-logo-preto.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ambar:#FCA001; --verm:#B70223; --preto:#0d0d0d; --off:#F5F1EA;
  --bg:#0d0d0d; --panel:#161616; --card:#1f1f1f; --card-h:#262626;
  --line:#2c2c2c; --txt:#F5F1EA; --muted:#9a948b; --ok:#1fa855;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:Montserrat,system-ui,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.hidden{display:none!important}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Bloqueio ---------- */
#lock{min-height:100%;display:grid;place-items:center;padding:24px;
  background:radial-gradient(circle at 20% 10%,rgba(252,160,1,.14),transparent 45%),radial-gradient(circle at 85% 90%,rgba(183,2,35,.2),transparent 50%),var(--bg)}
.lock-box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px 26px;text-align:center}
.lock-box img{height:44px;margin-bottom:18px}
.lock-box h1{font-size:20px;font-weight:800;margin-bottom:4px}
.lock-box p{color:var(--muted);font-size:13px;margin-bottom:22px}
.lock-box input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0f0f0f;text-align:center;font-size:16px;letter-spacing:.08em;outline:none}
.lock-box input:focus{border-color:var(--ambar)}
.lock-box input+input{margin-top:10px}
#apiUrl{font-size:13px;letter-spacing:0}
.sync-ok{color:var(--ok)}.sync-busy{color:var(--ambar)}.sync-err{color:#ff6b81}
.tag.tag-mut{color:var(--muted);background:#262626;margin-left:4px}
.lock-box .btn{width:100%;justify-content:center;margin-top:12px;padding:13px}
.lock-err{color:#ff6b81;font-size:13px;margin-top:10px;min-height:18px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap;transition:transform .15s,background .15s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--ambar);color:#111}
.btn-pri:hover{background:#ffb52e}
.btn-ghost{border:1px solid var(--line);background:var(--panel)}
.btn-ghost:hover{border-color:var(--ambar)}
.btn-danger{background:var(--verm);color:#fff}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover{background:#2f2f2f;color:var(--txt)}
.icon-btn:disabled{opacity:.25;pointer-events:none}

/* ---------- Topo ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(13,13,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 18px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand img{height:30px}
.brand b{font-weight:800;font-size:15px}
.brand span{display:block;color:var(--muted);font-size:11px;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.bar2{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 14px;color:var(--muted)}
.search input{flex:1;background:none;border:0;outline:none;padding:9px 0;color:var(--txt)}
.search:focus-within{border-color:var(--ambar)}
.stats{display:flex;gap:16px;color:var(--muted);font-size:12px;font-weight:600}
.stats b{color:var(--txt)}
.stats .won b{color:var(--ambar)}

/* ---------- Kanban ---------- */
.board{display:grid;grid-template-columns:repeat(5,minmax(260px,1fr));gap:14px;padding:18px;overflow-x:auto;min-height:calc(100vh - 130px);align-items:start;scroll-snap-type:x mandatory}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 165px);scroll-snap-align:start;transition:border-color .15s,background .15s}
.col.over{border-color:var(--ambar);background:#1b1710}
.col-h{display:flex;align-items:center;gap:8px;padding:13px 14px 11px;border-bottom:1px solid var(--line)}
.col-h .dot{width:9px;height:9px;border-radius:50%}
.col-h h2{font-size:13px;font-weight:800;flex:1}
.col-h .n{background:#262626;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;color:var(--muted)}
.list{padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;flex:1;min-height:90px}
.empty{color:#5d5852;font-size:12px;text-align:center;padding:22px 6px;border:1px dashed var(--line);border-radius:10px}
.add-in-col{margin:0 10px 10px;padding:9px;border-radius:10px;color:var(--muted);font-weight:600;font-size:12px;display:flex;justify-content:center;gap:6px;align-items:center}
.add-in-col:hover{background:#222;color:var(--txt)}

.card{background:var(--card);border:1px solid #2a2a2a;border-radius:12px;padding:12px 12px 8px;cursor:grab;transition:background .15s,border-color .15s,opacity .15s}
.card:hover{background:var(--card-h);border-color:#3a3a3a}
.card.dragging{opacity:.4}
.card-t{display:flex;gap:8px;align-items:flex-start}
.card-t h3{font-size:14px;font-weight:700;flex:1;word-break:break-word;cursor:pointer}
.card-t h3:hover{color:var(--ambar)}
.tag{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;color:var(--ambar);background:rgba(252,160,1,.1);border-radius:6px;padding:2px 7px}
.meta{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.meta div{display:flex;align-items:center;gap:6px;min-width:0}
.meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta svg{width:13px;height:13px}
.obs{margin-top:7px;font-size:12px;color:#bdb6ab;background:#191919;border-radius:8px;padding:6px 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.card-f{display:flex;align-items:center;gap:4px;margin-top:8px;padding-top:7px;border-top:1px solid #2b2b2b}
.card-f .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:8px;font-size:11px;font-weight:700;text-decoration:none;transition:filter .15s}
.chip:hover{filter:brightness(1.15)}
.chip svg{width:13px;height:13px}
.chip-wa{background:rgba(31,168,85,.15);color:#3ddc84}
.chip-ig{background:rgba(225,48,108,.14);color:#ff6fa3}
.chip-demo{background:rgba(252,160,1,.13);color:var(--ambar)}
.chip.ok{background:var(--ambar);color:#111}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.modal{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.modal h2{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.f input,.f textarea,.f select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f0f0f;outline:none;font-size:14px}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--ambar)}
.f textarea{min-height:96px;resize:vertical}
.inrow{display:flex;gap:6px}
.inrow input{flex:1;min-width:0}
.inrow .btn{padding:9px 12px}
.m-foot{display:flex;gap:8px;margin-top:6px;align-items:center}
.m-foot .sp{flex:1}
.m-info{font-size:11px;color:#6d675f;margin-top:12px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:80;background:var(--txt);color:#111;font-weight:700;font-size:13px;padding:11px 18px;border-radius:999px;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:760px){
  header{padding:10px 12px}
  .brand span{display:none}
  .actions{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  .actions .lbl{display:none}
  .stats{width:100%;justify-content:space-between}
  .board{grid-template-columns:repeat(5,86vw);padding:12px;gap:10px}
  .col{max-height:calc(100vh - 210px)}
  .grid2{grid-template-columns:1fr;gap:0}
}
</style>
</head>
<body>

<!-- ============ TELA DE BLOQUEIO ============ -->
<section id="lock">
  <form class="lock-box" id="lockForm" autocomplete="off">
    <img src="assets/cato-logo-branco.svg" alt="Cato Mídias">
    <h1>Painel interno</h1>
    <p>Funil de vendas · acesso restrito</p>
    <input type="url" id="apiUrl" class="hidden" placeholder="Link do App da Web (…/exec)" aria-label="Link do App da Web da planilha">
    <input type="password" id="pass" placeholder="Senha" aria-label="Senha" autofocus>
    <button class="btn btn-pri" type="submit" id="btnEnter">Entrar</button>
    <div class="lock-err" id="lockErr"></div>
  </form>
</section>

<!-- ============ PAINEL ============ -->
<div id="app" class="hidden">
  <header>
    <div class="top">
      <div class="brand">
        <img src="assets/cato-logo-branco.svg" alt="Cato Mídias">
        <div><b>Funil de Vendas</b><span id="sync">Planilha Prospecção CATO</span></div>
      </div>
      <div class="actions">
        <button class="btn btn-pri" id="btnNew" data-i="plus"><span>Novo lead</span></button>
        <button class="btn btn-ghost" id="btnCsv" data-i="upload"><span>Importar CSV</span></button>
        <button class="btn btn-ghost" id="btnExport" data-i="download"><span>Exportar Backup <span class="lbl">(JSON)</span></span></button>
        <button class="btn btn-ghost" id="btnRestore" data-i="restore"><span>Restaurar Backup</span></button>
        <button class="btn btn-ghost" id="btnPass" data-i="key" title="Trocar senha"><span class="lbl">Senha</span></button>
        <button class="btn btn-ghost" id="btnLock" data-i="lock" title="Bloquear painel"><span class="lbl">Sair</span></button>
      </div>
    </div>
    <div class="bar2">
      <label class="search"><i data-i="search"></i><input id="q" type="search" placeholder="Buscar por nome, categoria, telefone, Instagram…"></label>
      <div class="stats" id="stats"></div>
    </div>
  </header>
  <main class="board" id="board"></main>
</div>

<input type="file" id="fileCsv" accept=".csv,text/csv" class="hidden">
<input type="file" id="fileJson" accept=".json,application/json" class="hidden">

<!-- ============ MODAL LEAD ============ -->
<div class="overlay hidden" id="ov">
  <form class="modal" id="form" autocomplete="off">
    <h2><span id="mTitle">Novo lead</span><button type="button" class="icon-btn" id="mClose" aria-label="Fechar" data-i="x"></button></h2>
    <div class="f"><label for="fNome">Nome da empresa *</label><input id="fNome" required></div>
    <div class="grid2">
      <div class="f"><label for="fCat">Categoria</label><input id="fCat" list="cats" placeholder="Restaurante, bar, hamburgueria…"><datalist id="cats"></datalist></div>
      <div class="f"><label for="fEtapa">Etapa do funil</label><select id="fEtapa"></select></div>
    </div>
    <div class="grid2">
      <div class="f"><label for="fTel">Telefone / WhatsApp</label>
        <div class="inrow"><input id="fTel" type="tel" placeholder="(16) 99999-9999"><a class="btn btn-ghost chip-wa" id="fTelGo" target="_blank" rel="noopener" title="Abrir no WhatsApp" data-i="wa"></a></div></div>
      <div class="f"><label for="fIg">Instagram</label>
        <div class="inrow"><input id="fIg" placeholder="@perfil"><a class="btn btn-ghost chip-ig" id="fIgGo" target="_blank" rel="noopener" title="Abrir Instagram" data-i="ig"></a></div></div>
    </div>
    <div class="grid2">
      <div class="f"><label for="fEnd">Endereço</label><input id="fEnd" placeholder="Rua, número - bairro"></div>
      <div class="f"><label for="fWeb">Site atual</label><input id="fWeb" type="text" inputmode="url" placeholder="Site ou rede social que já usam"></div>
    </div>
    <div class="f"><label for="fDemo">Link da demo</label>
      <div class="inrow"><input id="fDemo" type="text" inputmode="url" placeholder="https://realliving.website/demo-…"><button type="button" class="btn btn-ghost" id="fDemoCopy" title="Copiar link" data-i="copy"></button><a class="btn btn-ghost" id="fDemoGo" target="_blank" rel="noopener" title="Abrir demo" data-i="ext"></a></div></div>
    <div class="f"><label for="fObs">Observações</label><textarea id="fObs" placeholder="Endereço, nome do dono, melhor horário, o que foi conversado…"></textarea></div>
    <div class="m-foot">
      <button type="button" class="btn btn-danger" id="mDel" data-i="trash"><span>Excluir</span></button>
      <span class="sp"></span>
      <button type="button" class="btn btn-ghost" id="mCancel">Cancelar</button>
      <button type="submit" class="btn btn-pri" data-i="check"><span>Salvar</span></button>
    </div>
    <div class="m-info" id="mInfo"></div>
  </form>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ================= Configuração ================= */
var STAGES = [
  {id:'leads',  name:'1. Leads',             color:'#7d776f'},
  {id:'demo',   name:'2. Demo Criada',       color:'#4f8cff'},
  {id:'msg',    name:'3. Mensagem Enviada',  color:'#b06cff'},
  {id:'neg',    name:'4. Em Negociação',     color:'#FCA001'},
  {id:'fechado',name:'5. Fechado',           color:'#1fa855'}
];
// Link do App da Web do Google Apps Script (termina em /exec).
// Se ficar vazio, o painel pede o link na tela de entrada e guarda neste navegador.
var API_URL = 'https://script.google.com/macros/s/AKfycbxJ_PZikiciCQ0iQsFaTe88lMTKflXCbwH1zlEQOHp0Hz5CwCt4X-uGSBpN-hhfpZgEGA/exec';
var KEY_URL = 'cato_crm_api_url';
var KEY_SESS = 'cato_crm_senha';          // sessionStorage: senha da aba aberta
var KEY_LEGADO = 'cato_crm_leads_v1';     // leads da versão antiga (só no navegador)
var KEY_MIGRADO = 'cato_crm_migrado_v1';
var SYNC_MS = 15000;                      // de quanto em quanto tempo busca novidades na planilha

/* ================= Ícones (SVG inline) ================= */
var I = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  restore:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  key:'<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  wa:'<path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/>',
  ig:'<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  left:'<path d="m15 18-6-6 6-6"/>',
  right:'<path d="m9 18 6-6-6-6"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'
};
function svg(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(I[n]||'')+'</svg>'}
function paintIcons(root){
  (root||document).querySelectorAll('[data-i]').forEach(function(el){
    if(el.dataset.iDone) return; el.dataset.iDone='1';
    el.insertAdjacentHTML('afterbegin', svg(el.dataset.i));
  });
}

/* ================= Utilidades ================= */
var $ = function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
function now(){return new Date().toISOString()}
function fmtDate(iso){try{return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
var toastT;
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2600)}

function waLink(tel){
  var d=String(tel||'').replace(/\D/g,'');
  if(!d) return '';
  d=d.replace(/^0+/,'');
  if(d.length===10||d.length===11) d='55'+d;   // número brasileiro sem DDI
  return 'https://wa.me/'+d;
}
function igHandle(v){
  v=String(v||'').trim(); if(!v) return '';
  var m=v.match(/instagram\.com\/([^/?#\s]+)/i);
  if(m) v=m[1];
  return v.replace(/^@/,'').replace(/\/+$/,'');
}
function igLink(v){var h=igHandle(v);return h?'https://instagram.com/'+encodeURIComponent(h):''}
function safeUrl(u){
  u=String(u||'').trim(); if(!u) return '';
  if(!/^https?:\/\//i.test(u)) u='https://'+u;
  return /^https?:\/\/[^\s]+$/i.test(u)?u:'';
}
function copyText(txt){
  if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(txt);
  return new Promise(function(res,rej){
    var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')?res():rej()}catch(e){rej(e)}finally{ta.remove()}
  });
}

/* ================= Dados ================= */
var leads=[];
function clean(o){
  if(!o||typeof o!=='object') return null;
  var nome=String(o.nome||'').trim(); if(!nome) return null;
  var etapa=STAGES.some(function(s){return s.id===o.etapa})?o.etapa:'leads';

/* ================= Planilha (Google Apps Script) ================= */
var senha='', pend=0, lastJson='', timer=null, dragging=false;
function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function apiUrl(){return API_URL||lsGet(KEY_URL)}
function api(acao,dados){
  var url=apiUrl();
  if(!url) return Promise.reject(Object.assign(new Error('Falta o link do App da Web.'),{codigo:'url'}));
  return fetch(url,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // text/plain evita o bloqueio de CORS do Google
      body:JSON.stringify(Object.assign({acao:acao,senha:senha},dados||{}))})
    .catch(function(){throw Object.assign(new Error('Sem conexão com a planilha. Confira a internet e o link do App da Web.'),{codigo:'rede'})})
    .then(function(r){return r.json().catch(function(){throw Object.assign(new Error('A planilha respondeu algo inesperado. Confira se o App da Web está publicado para "Qualquer pessoa".'),{codigo:'rede'})})})
    .then(function(j){if(!j.ok) throw Object.assign(new Error(j.erro||'Erro na planilha.'),{codigo:j.codigo||''});return j});
}
function setSync(state,msg){
  var s=$('sync');s.className=state?'sync-'+state:'';
  s.textContent=msg||({ok:'Sincronizado com a planilha',busy:'Salvando na planilha…',err:'Sem conexão com a planilha'})[state]||'';
}
function aplicar(lista){
  var j=JSON.stringify(lista);
  if(j===lastJson) return;
  lastJson=j;leads=lista.map(clean).filter(Boolean);
  if(!dragging) render();
}
function puxar(forcar){
  if(!senha||(pend&&!forcar)) return Promise.resolve();
  if(!forcar&&document.hidden) return Promise.resolve();
  return api('listar').then(function(j){
    if(!pend) aplicar(j.leads);
    setSync('ok','Sincronizado · '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  },falhou);
}
function falhou(e){
  if(e.codigo==='senha'||e.codigo==='bloqueado'){travar(e.message);return}
  setSync('err');
}
// grava na planilha; a tela já foi atualizada antes (resposta rápida) e é corrigida se der erro
function enviar(acao,dados,okMsg){
  pend++;setSync('busy');
  return api(acao,dados).then(function(j){
    pend--;if(okMsg) toast(okMsg);
    if(!pend) puxar(true);
    return j;
  },function(e){
    pend--;
    if(e.codigo==='senha'||e.codigo==='bloqueado'){travar(e.message);throw e}
    setSync('err');
    alert('Não consegui salvar na planilha.\n'+e.message+'\n\nVou recarregar os dados que estão lá.');
    lastJson='';puxar(true);
    throw e;
  });
}
function travar(msg){
  senha='';clearInterval(timer);timer=null;
  try{sessionStorage.removeItem(KEY_SESS)}catch(e){}
  closeModal();
  $('app').classList.add('hidden');$('lock').classList.remove('hidden');
  $('lockErr').textContent=msg||'';
  $('apiUrl').classList.toggle('hidden',!!apiUrl());
  $('pass').value='';$('pass').focus();
}
function entrar(s){
  senha=s;
  return api('listar').then(function(j){
    try{sessionStorage.setItem(KEY_SESS,s)}catch(e){}
    $('lock').classList.add('hidden');$('app').classList.remove('hidden');
    lastJson='';aplicar(j.leads);render();
    setSync('ok');
    clearInterval(timer);timer=setInterval(puxar,SYNC_MS);
    migrarLegado();
  },function(e){senha='';throw e});
}
// leads da versão antiga, que ficavam só neste navegador
function migrarLegado(){
  if(lsGet(KEY_MIGRADO)) return;
  var antigos=[];try{antigos=JSON.parse(lsGet(KEY_LEGADO)||'[]').map(clean).filter(Boolean)}catch(e){}
  if(!antigos.length){lsSet(KEY_MIGRADO,'1');return}
  if(!confirm('Encontrei '+antigos.length+' lead(s) que estavam salvos só neste navegador.\n\nEnviar para a planilha agora? (quem já estiver lá com o mesmo nome não é duplicado)')) return;
  enviar('importar',{leads:antigos,modo:'mesclar'}).then(function(r){
    lsSet(KEY_MIGRADO,'1');
    toast(r.adicionados+' lead(s) enviados para a planilha');
  });
}

/* ================= Importar CSV ================= */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  var first=text.split(/\r?\n/)[0]||'';
  var count=function(ch){return first.split(ch).length-1};
  var delim=[',',';','\t'].sort(function(a,b){return count(b)-count(a)})[0];
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}
      else f+=c;
    }else if(c==='"') q=true;
    else if(c===delim){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n') i++;
      row.push(f);rows.push(row);row=[];f='';
    }else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(function(r){return r.some(function(v){return v.trim()!==''})});
}
var COLS={
  nome:['nome','name','empresa','nome da empresa','estabelecimento','restaurante','title','titulo','razao social','nome fantasia','business','business name'],
  categoria:['categoria','category','tipo','segmento','nicho','type','categories','categorias'],
  telefone:['telefone','phone','whatsapp','celular','fone','tel','contato','phone number','telefone/whatsapp','numero'],
  instagram:['instagram','insta','ig','@'],
  demo:['demo','link da demo','link demo','site demo','link de acesso a demonstracao'],
  endereco:['endereco','address','endereço','localizacao','rua'],
  website:['website','site','site atual','url','web'],
  obs:['observacoes','observacao','obs','notas','notes']
};
function mapHeader(h){
  var idx={},used={},hn=h.map(norm);
  Object.keys(COLS).forEach(function(k){
    var i=hn.findIndex(function(x,j){return !used[j]&&COLS[k].indexOf(x)>-1});
    if(i<0) i=hn.findIndex(function(x,j){return !used[j]&&COLS[k].some(function(a){return a.length>3&&x.indexOf(a)>-1})});
    if(i>-1){idx[k]=i;used[i]=1}
  });
  return {idx:idx,used:used};
}
$('btnCsv').addEventListener('click',function(){$('fileCsv').value='';$('fileCsv').click()});
$('fileCsv').addEventListener('change',function(e){
  var file=e.target.files[0];if(!file) return;
  var rd=new FileReader();
  rd.onload=function(){
    var text=rd.result;
    // se vier com acentos quebrados (arquivo em Latin-1), relê nessa codificação
    if(/�/.test(text)){var r2=new FileReader();r2.onload=function(){importRows(r2.result)};r2.readAsText(file,'ISO-8859-1');return}
    importRows(text);
  };
  rd.readAsText(file,'UTF-8');
});
function importRows(text){
  var rows=parseCSV(text);
  if(rows.length<2){alert('O CSV está vazio ou só tem o cabeçalho.');return}
  var header=rows[0],m=mapHeader(header),idx=m.idx;
  if(idx.nome===undefined){
    alert('Não encontrei a coluna com o nome da empresa.\nCabeçalhos lidos: '+header.join(' | ')+'\n\nUse uma coluna chamada "nome" (ou "empresa", "estabelecimento", "restaurante").');
    return;
  }
  var existing={};leads.forEach(function(l){existing[norm(l.nome)]=1});
  var novos=[],dups=0,empty=0;
  rows.slice(1).forEach(function(r){
    var get=function(k){return idx[k]===undefined?'':String(r[idx[k]]||'').trim()};
    var nome=get('nome');
    if(!nome){empty++;return}
    var key=norm(nome);
    if(existing[key]){dups++;return}
    existing[key]=1;
    // colunas extras (endereço, nota, avaliações…) vão para Observações
    var extra=header.map(function(h,j){
      var v=String(r[j]||'').trim();
      return (!m.used[j]&&v&&h.trim())?h.trim()+': '+v:'';
    }).filter(Boolean);
    var obs=[get('obs')].concat(extra).filter(Boolean).join('\n');
    novos.push({id:uid(),nome:nome,categoria:get('categoria'),telefone:get('telefone'),instagram:get('instagram'),
      demo:get('demo'),endereco:get('endereco'),website:get('website'),obs:obs,etapa:'leads',criadoEm:now()});
  });
  if(!novos.length){alert('Nenhum lead novo para importar.'+(dups?'\n'+dups+' já existiam.':'')+(empty?'\n'+empty+' linha(s) sem nome.':''));return}
  toast('Enviando '+novos.length+' lead(s) para a planilha…');
  enviar('importar',{leads:novos,modo:'novos'}).then(function(r){
    aplicar(r.leads);
    var msg=r.adicionados+' lead(s) importado(s) para "1. Leads"';
    if(dups+r.ignorados) msg+=' · '+(dups+r.ignorados)+' já existiam (ignorados)';
    if(empty) msg+=' · '+empty+' linha(s) sem nome';
    toast(msg);
    if(dups||empty||r.ignorados) setTimeout(function(){alert(msg)},50);
  }).catch(function(){});
}

$('btnRestore').addEventListener('click',function(){$('fileJson').value='';$('fileJson').click()});
$('fileJson').addEventListener('change',function(e){
  var file=e.target.files[0];if(!file) return;
  var rd=new FileReader();
  rd.onload=function(){
    var data;
    try{data=JSON.parse(rd.result)}catch(err){alert('Arquivo inválido: não é um JSON.');return}
    var arr=Array.isArray(data)?data:(data&&Array.isArray(data.leads)?data.leads:null);
    if(!arr){alert('Esse arquivo não parece um backup do CRM da Cato.');return}
    var novos=arr.map(clean).filter(Boolean);
    if(!confirm('O backup tem '+novos.length+' lead(s).\n\nEnviar para a planilha?\n· Leads novos são adicionados.\n· Leads que já estão lá só são atualizados se a versão do backup for mais recente.\n· Nada é apagado da planilha.')) return;
    enviar('importar',{leads:novos,modo:'mesclar'}).then(function(r){
      aplicar(r.leads);
      toast('Backup restaurado · '+r.adicionados+' novo(s), '+r.atualizados+' atualizado(s)');
    }).catch(function(){});
  };
  rd.readAsText(file,'UTF-8');
});

/* ================= Início ================= */
paintIcons();
if(!apiUrl()) $('apiUrl').classList.remove('hidden');
var sess='';try{sess=sessionStorage.getItem(KEY_SESS)||''}catch(e){}
if(sess&&apiUrl()) entrar(sess).catch(function(e){$('lockErr').textContent=e.message});
})();
</script>
</body>
